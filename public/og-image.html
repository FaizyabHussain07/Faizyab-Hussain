<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=1200">
<title>OG Image</title>
<style>
  @font-face { font-family: 'Plus Jakarta Sans'; font-style: normal; font-weight: 400; font-display: swap; src: url('/fonts/PlusJakartaSans-normal-400-8021.woff2') format('woff2'); }
  @font-face { font-family: 'Plus Jakarta Sans'; font-style: normal; font-weight: 700; font-display: swap; src: url('/fonts/PlusJakartaSans-normal-700-8021.woff2') format('woff2'); }
  @font-face { font-family: 'Plus Jakarta Sans'; font-style: normal; font-weight: 800; font-display: swap; src: url('/fonts/PlusJakartaSans-normal-800-8021.woff2') format('woff2'); }
  @font-face { font-family: 'JetBrains Mono'; font-style: normal; font-weight: 400; font-display: swap; src: url('/fonts/JetBrainsMono-normal-400-10685.woff2') format('woff2'); }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    width: 1200px;
    height: 630px;
    overflow: hidden;
    font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
    background: #0A1917;
    color: #F2F7F5;
    position: relative;
  }

  /* Background glows */
  .glow {
    position: absolute;
    border-radius: 50%;
    filter: blur(100px);
    pointer-events: none;
  }
  .glow-1 {
    width: 500px; height: 500px;
    background: rgba(63, 187, 168, 0.12);
    top: -150px; right: -100px;
  }
  .glow-2 {
    width: 400px; height: 400px;
    background: rgba(240, 178, 78, 0.08);
    bottom: -150px; left: -80px;
  }
  .glow-3 {
    width: 300px; height: 300px;
    background: rgba(63, 187, 168, 0.06);
    bottom: 50px; right: 200px;
  }

  /* Grid pattern overlay */
  .grid-overlay {
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(63, 187, 168, 0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(63, 187, 168, 0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
  }

  /* Main content */
  .container {
    position: relative;
    z-index: 1;
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 80px 100px;
  }

  /* Logo */
  .logo {
    width: 56px;
    height: 56px;
    border-radius: 14px;
    background: #fff;
    padding: 6px;
    border: 1px solid #1D3A35;
    margin-bottom: 32px;
  }

  /* Eyebrow */
  .eyebrow {
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    font-weight: 400;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: #3FBBA8;
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 20px;
  }
  .eyebrow::before {
    content: '';
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #F0B24E;
  }

  /* Name */
  .name {
    font-size: 64px;
    font-weight: 800;
    letter-spacing: -0.03em;
    line-height: 1.05;
    margin-bottom: 16px;
  }

  /* Role */
  .role {
    font-size: 22px;
    font-weight: 600;
    color: #3FBBA8;
    margin-bottom: 28px;
  }

  /* Tagline */
  .tagline {
    font-size: 18px;
    color: #8FA8A2;
    line-height: 1.6;
    max-width: 700px;
  }

  /* Tech strip */
  .tech-strip {
    display: flex;
    gap: 10px;
    margin-top: 36px;
    flex-wrap: wrap;
  }
  .tech-tag {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    font-weight: 400;
    padding: 6px 14px;
    border-radius: 6px;
    border: 1px solid #1D3A35;
    color: #8FA8A2;
    letter-spacing: 0.03em;
  }

  /* Bottom bar */
  .bottom-bar {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    height: 4px;
    background: linear-gradient(90deg, #3FBBA8, #F0B24E);
  }

  /* Corner accent */
  .corner-accent {
    position: absolute;
    top: 60px;
    right: 80px;
    text-align: right;
  }
  .corner-accent .url {
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    color: #5C7A72;
    letter-spacing: 0.05em;
  }
</style>
</head>
<body>
  <div class="glow glow-1"></div>
  <div class="glow glow-2"></div>
  <div class="glow glow-3"></div>
  <div class="grid-overlay"></div>

  <div class="container">
    <img src="./faizyab-icon.png" alt="" class="logo" width="56" height="56">

    <div class="eyebrow">Full-Stack Developer · AI Engineer · AI Product Builder</div>

    <h1 class="name">Faizyab<br>Hussain</h1>

    <div class="role">Scalable AI & Web Systems</div>

    <div class="tagline">Building modern websites, web apps, SaaS products and AI-powered digital experiences.</div>

    <div class="tech-strip">
      <span class="tech-tag">React</span>
      <span class="tech-tag">Next.js</span>
      <span class="tech-tag">TypeScript</span>
      <span class="tech-tag">Node.js</span>
      <span class="tech-tag">AI</span>
      <span class="tech-tag">LLMs</span>
      <span class="tech-tag">APIs</span>
    </div>
  </div>

  <div class="corner-accent">
    <div class="url">faizyab-hussain.vercel.app</div>
  </div>

  <div class="bottom-bar"></div>
</body>
</html>
